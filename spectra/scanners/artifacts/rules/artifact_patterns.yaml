schema_version: "1.0"
description: "Safe non-code artifact and configuration candidate definitions. Content values are never emitted."

file_extensions:
  ".pem": "pem_file"
  ".crt": "certificate_file"
  ".cer": "certificate_file"
  ".cert": "certificate_file"
  ".der": "certificate_file"
  ".csr": "certificate_request_file"
  ".key": "private_key_file"
  ".pub": "public_key_file"
  ".p12": "pkcs12_keystore"
  ".pfx": "pkcs12_keystore"
  ".p7b": "pkcs7_certificate_bundle"
  ".p7c": "pkcs7_certificate_bundle"
  ".jks": "java_keystore"
  ".jceks": "java_keystore"
  ".keystore": "keystore_file"
  ".truststore": "truststore_file"

special_filenames:
  "authorized_keys": "ssh_authorized_keys"
  "known_hosts": "ssh_known_hosts"
  "id_rsa": "ssh_private_key"
  "id_ecdsa": "ssh_private_key"
  "id_ed25519": "ssh_private_key"
  "openssl.cnf": "openssl_configuration"

content_markers:
  "-----BEGIN CERTIFICATE-----": "certificate_pem_marker"
  "-----BEGIN X509 CERTIFICATE-----": "certificate_pem_marker"
  "-----BEGIN PRIVATE KEY-----": "private_key_pem_marker"
  "-----BEGIN RSA PRIVATE KEY-----": "private_key_pem_marker"
  "-----BEGIN EC PRIVATE KEY-----": "private_key_pem_marker"
  "-----BEGIN ENCRYPTED PRIVATE KEY-----": "encrypted_private_key_pem_marker"
  "-----BEGIN PUBLIC KEY-----": "public_key_pem_marker"
  "-----BEGIN RSA PUBLIC KEY-----": "public_key_pem_marker"
  "-----BEGIN CERTIFICATE REQUEST-----": "certificate_request_pem_marker"

configuration_extensions:
  - ".yaml"
  - ".yml"
  - ".json"
  - ".toml"
  - ".ini"
  - ".cfg"
  - ".conf"
  - ".properties"
  - ".env"
  - ".tf"
  - ".tfvars"
  - ".xml"
  - ".hcl"

configuration_filenames:
  - "dockerfile"
  - "compose.yml"
  - "compose.yaml"

entries:
  - term: "tls"
    category: "protocol_configuration"
  - term: "ssl"
    category: "protocol_configuration"
  - term: "certificate"
    category: "certificate_reference"
  - term: "cert_file"
    category: "certificate_reference"
  - term: "private_key"
    category: "private_key_reference"
  - term: "private-key"
    category: "private_key_reference"
  - term: "key_file"
    category: "private_key_reference"
  - term: "keystore"
    category: "keystore_reference"
  - term: "truststore"
    category: "truststore_reference"
  - term: "kms"
    category: "key_management_reference"
  - term: "keyvault"
    category: "key_management_reference"
  - term: "key_vault"
    category: "key_management_reference"
  - term: "hsm"
    category: "hardware_security_module_reference"
  - term: "cipher_suite"
    category: "cipher_configuration"
  - term: "tls_version"
    category: "protocol_configuration"
  - term: "ssl_protocol"
    category: "protocol_configuration"