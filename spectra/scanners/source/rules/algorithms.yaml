version: "1.0"
algorithms:
  # --- Symmetric Ciphers ---
  - id: ALGO-AES
    name: AES
    primitive: symmetric_cipher
    quantum_safe: false
    nist_status: approved
    patterns:
      - '(?i)\bAES[-_]?(128|192|256)?[-_]?(GCM|CBC|CTR|ECB|CFB|OFB)?\b'
    weak_modes:
      - ECB

  - id: ALGO-3DES
    name: 3DES
    primitive: symmetric_cipher
    quantum_safe: false
    nist_status: deprecated_classical
    patterns:
      - '(?i)\b(3DES|DES3|DESede|TripleDES|des-ede3)\b'
    weak_modes:
      - ALL

  - id: ALGO-DES
    name: DES
    primitive: symmetric_cipher
    quantum_safe: false
    nist_status: deprecated_classical
    patterns:
      - '(?i)\bDES\b'
    weak_modes:
      - ALL

  - id: ALGO-RC4
    name: RC4
    primitive: symmetric_cipher
    quantum_safe: false
    nist_status: broken_classical
    patterns:
      - '(?i)\b(RC4|ARC4)\b'
    weak_modes:
      - ALL

  - id: ALGO-BLOWFISH
    name: Blowfish
    primitive: symmetric_cipher
    quantum_safe: false
    nist_status: deprecated_classical
    patterns:
      - '(?i)\bBlowfish\b'
    weak_modes:
      - ALL

  - id: ALGO-CHACHA20
    name: ChaCha20
    primitive: symmetric_cipher
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bChaCha20\b'
    weak_modes: []

  - id: ALGO-CHACHA20-POLY1305
    name: ChaCha20-Poly1305
    primitive: symmetric_cipher
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bChaCha20[-_]?Poly1305\b'
    weak_modes: []

  - id: ALGO-XSALSA20-POLY1305
    name: XSalsa20-Poly1305
    primitive: symmetric_cipher
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bXSalsa20\b'
    weak_modes: []

  - id: ALGO-X25519-XSALSA20-POLY1305
    name: X25519-XSalsa20-Poly1305
    primitive: key_exchange
    quantum_safe: false
    nist_status: deprecated_pqc
    patterns:
      - '(?i)\bX25519\b'
    weak_modes: []

  # --- Asymmetric / Public Key & Curves ---
  - id: ALGO-RSA
    name: RSA
    primitive: public_key
    quantum_safe: false
    nist_status: deprecated_pqc
    patterns:
      - '(?i)\bRSA[-_]?(1024|2048|3072|4096)?\b'
    weak_modes: []

  - id: ALGO-ECC
    name: ECC
    primitive: public_key
    quantum_safe: false
    nist_status: deprecated_pqc
    patterns:
      - '(?i)\b(ECC|ECDSA|ECDH)\b'
    weak_modes: []

  - id: ALGO-ECDSA
    name: ECDSA
    primitive: signature
    quantum_safe: false
    nist_status: deprecated_pqc
    patterns:
      - '(?i)\bECDSA\b'
      - '(?i)\b(secp256k1|secp256r1|secp384r1|secp521r1|prime256v1)\b'
    weak_modes: []

  - id: ALGO-ECDH
    name: ECDH
    primitive: key_exchange
    quantum_safe: false
    nist_status: deprecated_pqc
    patterns:
      - '(?i)\b(ECDH|ECDHE)\b'
    weak_modes: []

  - id: ALGO-ED25519
    name: Ed25519
    primitive: signature
    quantum_safe: false
    nist_status: deprecated_pqc
    patterns:
      - '(?i)\bEd25519\b'
    weak_modes: []

  - id: ALGO-X25519
    name: X25519
    primitive: key_exchange
    quantum_safe: false
    nist_status: deprecated_pqc
    patterns:
      - '(?i)\bX25519\b'
    weak_modes: []

  - id: ALGO-ED448
    name: Ed448
    primitive: signature
    quantum_safe: false
    nist_status: deprecated_pqc
    patterns:
      - '(?i)\bEd448\b'
    weak_modes: []

  - id: ALGO-X448
    name: X448
    primitive: key_exchange
    quantum_safe: false
    nist_status: deprecated_pqc
    patterns:
      - '(?i)\bX448\b'
    weak_modes: []

  - id: ALGO-DSA
    name: DSA
    primitive: signature
    quantum_safe: false
    nist_status: deprecated_classical
    patterns:
      - '(?i)\bDSA[-_]?(1024|2048)?\b'
    weak_modes: []

  # --- Post-Quantum Cryptography ---
  - id: ALGO-ML-KEM
    name: ML-KEM
    primitive: key_encapsulation
    quantum_safe: true
    nist_status: fips_203_standard
    patterns:
      - '(?i)\b(ML[-_]?KEM|Kyber)[-_]?(512|768|1024)?\b'
    weak_modes: []

  - id: ALGO-ML-DSA
    name: ML-DSA
    primitive: signature
    quantum_safe: true
    nist_status: fips_204_standard
    patterns:
      - '(?i)\b(ML[-_]?DSA|Dilithium)[-_]?(44|65|87)?\b'
    weak_modes: []

  - id: ALGO-SLH-DSA
    name: SLH-DSA
    primitive: signature
    quantum_safe: true
    nist_status: fips_205_standard
    patterns:
      - '(?i)\b(SLH[-_]?DSA|SPHINCS\+?)\b'
    weak_modes: []

  # --- Hash Functions ---
  - id: ALGO-SHA2
    name: SHA-2
    primitive: hash
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bSHA[-_]?(224|256|384|512)\b'
    weak_modes: []

  - id: ALGO-SHA2-224
    name: SHA-224
    primitive: hash
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bSHA[-_]?224\b'
    weak_modes: []

  - id: ALGO-SHA2-256
    name: SHA-256
    primitive: hash
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bSHA[-_]?256\b'
    weak_modes: []

  - id: ALGO-SHA2-384
    name: SHA-384
    primitive: hash
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bSHA[-_]?384\b'
    weak_modes: []

  - id: ALGO-SHA2-512
    name: SHA-512
    primitive: hash
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bSHA[-_]?512\b'
    weak_modes: []

  - id: ALGO-SHA3
    name: SHA-3
    primitive: hash
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bSHA3\b'
    weak_modes: []

  - id: ALGO-SHA3-256
    name: SHA3-256
    primitive: hash
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bSHA3[-_]?256\b'
    weak_modes: []

  - id: ALGO-SHA3-512
    name: SHA3-512
    primitive: hash
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bSHA3[-_]?512\b'
    weak_modes: []

  - id: ALGO-BLAKE2B
    name: BLAKE2b
    primitive: hash
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bBLAKE2b\b'
    weak_modes: []

  - id: ALGO-BLAKE2S
    name: BLAKE2s
    primitive: hash
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bBLAKE2s\b'
    weak_modes: []

  - id: ALGO-MD5
    name: MD5
    primitive: hash
    quantum_safe: false
    nist_status: broken_classical
    patterns:
      - '(?i)\bMD5\b'
    weak_modes:
      - ALL

  - id: ALGO-SHA1
    name: SHA-1
    primitive: hash
    quantum_safe: false
    nist_status: broken_classical
    patterns:
      - '(?i)\bSHA[-_]?1\b'
    weak_modes:
      - ALL

  - id: ALGO-HMAC
    name: HMAC
    primitive: mac
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bHMAC\b'
    weak_modes: []

  # --- General Loaders & System Crypto ---
  - id: ALGO-ASYMMETRIC-KEY
    name: AsymmetricKey
    primitive: key_management
    quantum_safe: false
    nist_status: approved
    patterns: []
    weak_modes: []

  - id: ALGO-X509
    name: X.509
    primitive: certificate
    quantum_safe: false
    nist_status: approved
    patterns: []
    weak_modes: []

  - id: ALGO-CSPRNG
    name: CSPRNG
    primitive: prng
    quantum_safe: true
    nist_status: approved
    patterns: []
    weak_modes: []