version: "1.0"
language: compiled

libraries:
  # --- C / C++ (OpenSSL / BoringSSL / libsodium) ---
  - name: openssl
    headers:
      - "openssl/evp.h"
      - "openssl/aes.h"
      - "openssl/rsa.h"
      - "openssl/sha.h"
    call_patterns:
      - call: "EVP_aes_256_gcm"
        algo_id: ALGO-AES
      - call: "EVP_aes_128_cbc"
        algo_id: ALGO-AES
      - call: "EVP_aes_128_ecb"
        algo_id: ALGO-AES
        flag_insecure: true
      - call: "EVP_des_ede3_cbc"
        algo_id: ALGO-DES
        flag_insecure: true
      - call: "RSA_generate_key_ex"
        algo_id: ALGO-RSA
      - call: "EVP_sha256"
        algo_id: ALGO-SHA2
      - call: "EVP_md5"
        algo_id: ALGO-MD5
        flag_insecure: true

  - name: libsodium
    headers:
      - "sodium.h"
    call_patterns:
      - call: "crypto_box_keypair"
        algo_id: ALGO-ECDH
      - call: "crypto_sign_keypair"
        algo_id: ALGO-ECDSA
      - call: "crypto_secretbox_easy"
        algo_id: ALGO-CHACHA20

  # --- Go (Standard Library & x/crypto) ---
  - name: go_crypto
    imports:
      - "crypto/aes"
      - "crypto/des"
      - "crypto/rsa"
      - "crypto/ecdsa"
      - "crypto/sha256"
      - "crypto/md5"
      - "crypto/tls"
      - "golang.org/x/crypto"
    call_patterns:
      - call: "aes.NewCipher"
        algo_id: ALGO-AES
      - call: "des.NewCipher"
        algo_id: ALGO-DES
        flag_insecure: true
      - call: "des.NewTripleDESCipher"
        algo_id: ALGO-DES
        flag_insecure: true
      - call: "rsa.GenerateKey"
        algo_id: ALGO-RSA
      - call: "ecdsa.GenerateKey"
        algo_id: ALGO-ECDSA
      - call: "md5.New"
        algo_id: ALGO-MD5
        flag_insecure: true
      - call: "sha256.New"
        algo_id: ALGO-SHA2

  # --- Rust (ring, rustls, aes-gcm, rsa) ---
  - name: rust_crypto
    imports:
      - "ring::aead"
      - "ring::agreement"
      - "ring::signature"
      - "aes_gcm"
      - "rsa"
      - "rustls"
    call_patterns:
      - call: "Aes256Gcm::new"
        algo_id: ALGO-AES
      - call: "Aes128Gcm::new"
        algo_id: ALGO-AES
      - call: "RsaPrivateKey::new"
        algo_id: ALGO-RSA
      - call: "aead::AES_256_GCM"
        algo_id: ALGO-AES
      - call: "aead::CHACHA20_POLY1305"
        algo_id: ALGO-CHACHA20