version: "2.0"
language: go
description: "Comprehensive Go cryptographic rules covering crypto/* standard library, golang.org/x/crypto, PQC modules, and CodeQL Layer 3 crypto extraction targets."

libraries:
  # =========================================================================
  # 1. GO STANDARD LIBRARY CRYPTO (crypto/*)
  # =========================================================================
  - name: go_crypto
    imports:
      - "crypto/aes"
      - "crypto/des"
      - "crypto/rc4"
      - "crypto/cipher"
      - "crypto/rsa"
      - "crypto/ecdsa"
      - "crypto/ed25519"
      - "crypto/ecdh"
      - "crypto/elliptic"
      - "crypto/x509"
      - "crypto/sha256"
      - "crypto/sha512"
      - "crypto/sha1"
      - "crypto/md5"
      - "crypto/hmac"
      - "crypto/tls"
      - "crypto/rand"
    call_patterns:
      # --- Symmetric Ciphers ---
      - call: "aes.NewCipher"
        algo_id: ALGO-AES
        primitive: "symmetric_cipher"
        operation: "symmetric_cipher_init"

      - call: "des.NewCipher"
        algo_id: ALGO-DES
        primitive: "symmetric_cipher"
        flag_insecure: true
        operation: "symmetric_cipher_init"

      - call: "des.NewTripleDESCipher"
        algo_id: ALGO-3DES
        primitive: "symmetric_cipher"
        flag_insecure: true
        operation: "symmetric_cipher_init"

      - call: "rc4.NewCipher"
        algo_id: ALGO-RC4
        primitive: "symmetric_cipher"
        flag_insecure: true
        operation: "symmetric_cipher_init"

      # Block Cipher Modes & AEAD
      - call: "cipher.NewGCM"
        mode: "GCM"
        primitive: "symmetric_cipher"
        operation: "aead_init"

      - call: "cipher.NewCBCEncrypter"
        mode: "CBC"
        primitive: "symmetric_cipher"
        operation: "encryption_init"

      - call: "cipher.NewCBCDecrypter"
        mode: "CBC"
        primitive: "symmetric_cipher"
        operation: "decryption_init"

      - call: "cipher.NewCTR"
        mode: "CTR"
        primitive: "symmetric_cipher"
        operation: "stream_init"

      # --- Asymmetric Key Generation ---
      - call: "rsa.GenerateKey"
        algo_id: ALGO-RSA
        primitive: "public_key"
        operation: "keypair_generation"
        flag_insecure_if:
          key_size_less_than: 2048

      - call: "ecdsa.GenerateKey"
        algo_id: ALGO-ECDSA
        primitive: "signature"
        operation: "keypair_generation"

      - call: "ed25519.GenerateKey"
        algo_id: ALGO-ED25519
        primitive: "signature"
        curve: "Ed25519"
        operation: "keypair_generation"

      - call: "ecdh.P256"
        algo_id: ALGO-ECDH
        primitive: "key_exchange"
        curve: "NIST-P256"
        operation: "key_agreement_init"

      - call: "ecdh.P384"
        algo_id: ALGO-ECDH
        primitive: "key_exchange"
        curve: "NIST-P384"
        operation: "key_agreement_init"

      - call: "ecdh.P521"
        algo_id: ALGO-ECDH
        primitive: "key_exchange"
        curve: "NIST-P521"
        operation: "key_agreement_init"

      - call: "ecdh.X25519"
        algo_id: ALGO-X25519
        primitive: "key_exchange"
        curve: "X25519"
        operation: "key_agreement_init"

      # --- Elliptic Curve Parameter References ---
      - call: "elliptic.P256"
        algo_id: ALGO-ECC
        primitive: "public_key"
        curve: "NIST-P256"

      - call: "elliptic.P384"
        algo_id: ALGO-ECC
        primitive: "public_key"
        curve: "NIST-P384"

      - call: "elliptic.P521"
        algo_id: ALGO-ECC
        primitive: "public_key"
        curve: "NIST-P521"

      # --- CodeQL Target: Digital Signatures & Verifications ---
      - call: "rsa.SignPKCS1v15"
        algo_id: ALGO-RSA
        primitive: "signature"
        operation: "digital_signature"

      - call: "rsa.VerifyPKCS1v15"
        algo_id: ALGO-RSA
        primitive: "signature"
        operation: "signature_verification"

      - call: "rsa.SignPSS"
        algo_id: ALGO-RSA
        primitive: "signature"
        operation: "digital_signature"

      - call: "rsa.VerifyPSS"
        algo_id: ALGO-RSA
        primitive: "signature"
        operation: "signature_verification"

      - call: "ecdsa.SignASN1"
        algo_id: ALGO-ECDSA
        primitive: "signature"
        operation: "digital_signature"

      - call: "ecdsa.VerifyASN1"
        algo_id: ALGO-ECDSA
        primitive: "signature"
        operation: "signature_verification"

      - call: "ed25519.Sign"
        algo_id: ALGO-ED25519
        curve: "Ed25519"
        primitive: "signature"
        operation: "digital_signature"

      - call: "ed25519.Verify"
        algo_id: ALGO-ED25519
        curve: "Ed25519"
        primitive: "signature"
        operation: "signature_verification"

      # --- CodeQL Target: X.509 Certificates ---
      - call: "x509.ParseCertificate"
        algo_id: ALGO-X509
        primitive: "certificate"
        operation: "certificate_parsing"

      - call: "x509.ParseCertificates"
        algo_id: ALGO-X509
        primitive: "certificate"
        operation: "certificate_parsing"

      - call: "tls.LoadX509KeyPair"
        algo_id: ALGO-X509
        primitive: "key_management"
        operation: "load_keypair"

      # --- CodeQL Target: TLS Listeners & Handshakes ---
      - call: "tls.Listen"
        primitive: "secure_transport"
        operation: "tls_server_listen"

      - call: "tls.Server"
        primitive: "secure_transport"
        operation: "tls_server_init"

      - call: "tls.Client"
        primitive: "secure_transport"
        operation: "tls_client_init"

      # --- Hash Functions & MAC ---
      - call: "sha256.New"
        algo_id: ALGO-SHA2-256
        primitive: "hash"
        operation: "digest_computation"

      - call: "sha512.New"
        algo_id: ALGO-SHA2-512
        primitive: "hash"
        operation: "digest_computation"

      - call: "sha1.New"
        algo_id: ALGO-SHA1
        primitive: "hash"
        flag_insecure: true
        operation: "digest_computation"

      - call: "md5.New"
        algo_id: ALGO-MD5
        primitive: "hash"
        flag_insecure: true
        operation: "digest_computation"

      - call: "hmac.New"
        algo_id: ALGO-HMAC
        primitive: "mac"
        operation: "mac_computation"

      # --- Randomness ---
      - call: "rand.Read"
        algo_id: ALGO-CSPRNG
        primitive: "prng"
        operation: "secure_random"

  # =========================================================================
  # 2. EXTENDED & THIRD-PARTY CRYPTO (golang.org/x/crypto)
  # =========================================================================
  - name: golang_x_crypto
    imports:
      - "golang.org/x/crypto/chacha20poly1305"
      - "golang.org/x/crypto/nacl/secretbox"
      - "golang.org/x/crypto/curve25519"
      - "golang.org/x/crypto/sha3"
      - "golang.org/x/crypto/argon2"
    call_patterns:
      - call: "chacha20poly1305.New"
        algo_id: ALGO-CHACHA20-POLY1305
        primitive: "symmetric_cipher"
        operation: "aead_init"

      - call: "secretbox.Seal"
        algo_id: ALGO-XSALSA20-POLY1305
        primitive: "symmetric_cipher"
        operation: "encryption"

      - call: "curve25519.X25519"
        algo_id: ALGO-X25519
        primitive: "key_exchange"
        curve: "X25519"
        operation: "key_agreement"

      - call: "sha3.New256"
        algo_id: ALGO-SHA3-256
        primitive: "hash"
        operation: "digest_computation"

      - call: "sha3.New512"
        algo_id: ALGO-SHA3-512
        primitive: "hash"
        operation: "digest_computation"

      - call: "argon2.IDKey"
        algo_id: ALGO-ARGON2
        primitive: "key_derivation"
        operation: "key_derivation"

  # =========================================================================
  # 3. POST-QUANTUM CRYPTOGRAPHY (circl, etc.)
  # =========================================================================
  - name: cloudflare_circl
    imports:
      - "github.com/cloudflare/circl/kem/kyber/kyber768"
      - "github.com/cloudflare/circl/kem/kyber"
      - "github.com/cloudflare/circl/sign/dilithium"
      - "github.com/cloudflare/circl/sign/sphincs"
    call_patterns:
      - call: "kyber768.GenerateKeyPair"
        algo_id: ALGO-ML-KEM
        primitive: "key_encapsulation"
        operation: "keypair_generation"

      - call: "dilithium.GenerateKey"
        algo_id: ALGO-ML-DSA
        primitive: "signature"
        operation: "keypair_generation"

      - call: "sphincs.GenerateKey"
        algo_id: ALGO-SLH-DSA
        primitive: "signature"
        operation: "keypair_generation"