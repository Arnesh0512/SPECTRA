version: "1.0"
description: "Crypto-capable dependency package catalog across all supported ecosystems."

packages:
  # --- Python Ecosystem ---
  - name: "cryptography"
    ecosystems: ["python"]
  - name: "pycryptodome"
    ecosystems: ["python"]
  - name: "pycrypto"
    ecosystems: ["python"]
  - name: "pynacl"
    ecosystems: ["python"]
  - name: "pyopenssl"
    ecosystems: ["python"]
  - name: "python-jose"
    ecosystems: ["python"]
  - name: "jwcrypto"
    ecosystems: ["python"]
  - name: "bcrypt"
    ecosystems: ["python", "javascript", "rust"]
  - name: "argon2-cffi"
    ecosystems: ["python"]
  - name: "paramiko"
    ecosystems: ["python"]

  # --- JVM (Java / Kotlin) ---
  - name: "org.bouncycastle"
    ecosystems: ["java", "kotlin"]
    prefixes:
      - "org.bouncycastle:bcprov-"
      - "org.bouncycastle:bcpkix-"
      - "org.bouncycastle:bcpg-"
  - name: "com.google.crypto.tink:tink"
    ecosystems: ["java", "kotlin"]
  - name: "org.conscrypt:conscrypt-openjdk-uber"
    ecosystems: ["java", "kotlin"]
  - name: "org.apache.santuario:xmlsec"
    ecosystems: ["java", "kotlin"]
  - name: "org.jasypt:jasypt"
    ecosystems: ["java", "kotlin"]

  # --- Go Ecosystem ---
  - name: "golang.org/x/crypto"
    ecosystems: ["go"]
  - name: "github.com/google/tink/go"
    ecosystems: ["go"]
  - name: "github.com/cloudflare/circl"
    ecosystems: ["go"]
  - name: "github.com/youmark/pkcs8"
    ecosystems: ["go"]
  - name: "github.com/lestrrat-go/jwx"
    ecosystems: ["go"]
  - name: "github.com/golang-jwt/jwt"
    ecosystems: ["go"]
    prefixes:
      - "github.com/golang-jwt/jwt/"

  # --- JavaScript / TypeScript ---
  - name: "crypto-js"
    ecosystems: ["javascript", "typescript"]
  - name: "node-forge"
    ecosystems: ["javascript", "typescript"]
  - name: "jose"
    ecosystems: ["javascript", "typescript"]
  - name: "jsonwebtoken"
    ecosystems: ["javascript", "typescript"]
  - name: "tweetnacl"
    ecosystems: ["javascript", "typescript"]
  - name: "libsodium-wrappers"
    ecosystems: ["javascript", "typescript"]
  - name: "argon2"
    ecosystems: ["javascript", "typescript", "rust"]
  - name: "elliptic"
    ecosystems: ["javascript", "typescript"]

  # --- Rust Ecosystem ---
  - name: "ring"
    ecosystems: ["rust"]
  - name: "rustls"
    ecosystems: ["rust"]
  - name: "openssl"
    ecosystems: ["rust", "cpp"]
  - name: "openssl-sys"
    ecosystems: ["rust"]
  - name: "aes-gcm"
    ecosystems: ["rust"]
  - name: "chacha20poly1305"
    ecosystems: ["rust"]
  - name: "ed25519-dalek"
    ecosystems: ["rust"]
  - name: "x25519-dalek"
    ecosystems: ["rust"]
  - name: "rsa"
    ecosystems: ["rust"]
  - name: "p256"
    ecosystems: ["rust"]
  - name: "p384"
    ecosystems: ["rust"]
  - name: "sha2"
    ecosystems: ["rust"]
  - name: "hmac"
    ecosystems: ["rust"]
  - name: "hkdf"
    ecosystems: ["rust"]

  # --- C / C++ Ecosystem ---
  - name: "libsodium"
    ecosystems: ["cpp"]
  - name: "botan"
    ecosystems: ["cpp"]
  - name: "cryptopp"
    ecosystems: ["cpp"]
    aliases:
      - "crypto++"
      - "crypto-plus-plus"
  - name: "mbedtls"
    ecosystems: ["cpp"]
  - name: "wolfssl"
    ecosystems: ["cpp"]
  - name: "libressl"
    ecosystems: ["cpp"]
  - name: "gnutls"
    ecosystems: ["cpp"]
  - name: "boringssl"
    ecosystems: ["cpp"]