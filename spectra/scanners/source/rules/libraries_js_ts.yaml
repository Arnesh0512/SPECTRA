version: "2.0"
language: js_ts
description: "Unified JavaScript and TypeScript ruleset covering Node.js crypto, WebCrypto, CryptoJS, node-forge, noble-curves, tweetnacl, jsonwebtoken, jose, bcrypt, and argon2."

libraries:
  # =========================================================================
  # 1. NODE.JS CORE CRYPTO MODULE (crypto & node:crypto)
  # =========================================================================
  - name: node_crypto
    imports:
      - "crypto"
      - "node:crypto"
      - "tls"
      - "https"
    call_patterns:
      # Symmetric Encryption & Decryption
      - call: "createCipheriv"
        operation: "symmetric_encryption_init"
        extract_args:
          position_0: "algorithm"
        flag_insecure_modes:
          - "ecb"

      - call: "createDecipheriv"
        operation: "symmetric_decryption_init"
        extract_args:
          position_0: "algorithm"
        flag_insecure_modes:
          - "ecb"

      - call: "createCipher"
        operation: "symmetric_encryption_init"
        flag_insecure: true
        issue: "Deprecated crypto.createCipher() used (derives weak keys using OpenSSL EVP_BytesToKey)"

      - call: "createDecipher"
        operation: "symmetric_decryption_init"
        flag_insecure: true
        issue: "Deprecated crypto.createDecipher() used"

      # Asymmetric Key Pair Generation
      - call: "generateKeyPair"
        operation: "keypair_generation"
        extract_args:
          position_0: "type"
        flag_insecure_if:
          key_size_less_than: 2048

      - call: "generateKeyPairSync"
        operation: "keypair_generation"
        extract_args:
          position_0: "type"
        flag_insecure_if:
          key_size_less_than: 2048

      - call: "generateKey"
        operation: "symmetric_key_generation"

      - call: "generateKeySync"
        operation: "symmetric_key_generation"

      # CodeQL Ingested Key Deserialization
      - call: "createPrivateKey"
        operation: "load_private_key"
        algo_id: ALGO-ASYMMETRIC-KEY
        primitive: "key_management"

      - call: "createPublicKey"
        operation: "load_public_key"
        algo_id: ALGO-ASYMMETRIC-KEY
        primitive: "key_management"

      # CodeQL Ingested TLS Context & Server Creation
      - call: "createSecureContext"
        operation: "tls_session_init"
        primitive: "secure_transport"
        extract_args:
          minVersion: "protocol"
          ciphers: "cipher_suite"

      - call: "createServer"
        operation: "tls_server_init"
        primitive: "secure_transport"

      # Cryptographic Hashes & MACs
      - call: "createHash"
        operation: "digest_computation"
        extract_args:
          position_0: "algorithm"
        flag_insecure_algorithms:
          - "md5"
          - "sha1"

      - call: "createHmac"
        operation: "mac_computation"
        extract_args:
          position_0: "algorithm"
        flag_insecure_algorithms:
          - "md5"
          - "sha1"

      # Digital Signatures & Verification (CodeQL Call Targets)
      - call: "createSign"
        operation: "signature_generation"
        extract_args:
          position_0: "algorithm"

      - call: "createVerify"
        operation: "signature_verification"
        extract_args:
          position_0: "algorithm"

      - call: "sign"
        operation: "digital_signature"

      - call: "verify"
        operation: "signature_verification"

      # Diffie-Hellman Key Exchange
      - call: "createDiffieHellman"
        algo_id: ALGO-ECDH
        primitive: "key_exchange"
        operation: "key_agreement_init"

      - call: "createECDH"
        algo_id: ALGO-ECDH
        primitive: "key_exchange"
        operation: "key_agreement_init"
        curve_mappings:
          secp256k1: "secp256k1"
          prime256v1: "NIST-P256"
          secp384r1: "NIST-P384"
          secp521r1: "NIST-P521"

      # CSPRNG
      - call: "randomBytes"
        algo_id: ALGO-CSPRNG
        primitive: "prng"
        operation: "secure_random"

      - call: "randomUUID"
        algo_id: ALGO-CSPRNG
        primitive: "prng"

  # =========================================================================
  # 2. JWT & JOSE (from javascript.json, typescript.json)
  # =========================================================================
  - name: jwt_and_jose
    imports:
      - "jsonwebtoken"
      - "jose"
    call_patterns:
      - call: "jwt.sign"
        algo_id: ALGO-JWT
        primitive: "signature"
        operation: "token_generation"

      - call: "jwt.verify"
        algo_id: ALGO-JWT
        primitive: "signature"
        operation: "token_verification"

      - call: "SignJWT"
        algo_id: ALGO-JWT
        primitive: "signature"
        operation: "token_generation"

      - call: "jwtVerify"
        algo_id: ALGO-JWT
        primitive: "signature"
        operation: "token_verification"

  # =========================================================================
  # 3. PASSWORD HASHING & KDF (bcrypt, argon2, panva/hkdf)
  # =========================================================================
  - name: kdf_and_password_hashes
    imports:
      - "bcrypt"
      - "argon2"
      - "@panva/hkdf"
    call_patterns:
      - call: "bcrypt.hash"
        algo_id: ALGO-BCRYPT
        primitive: "key_derivation"
        operation: "password_hash"

      - call: "bcrypt.compare"
        algo_id: ALGO-BCRYPT
        primitive: "key_derivation"
        operation: "password_verify"

      - call: "argon2.hash"
        algo_id: ALGO-ARGON2
        primitive: "key_derivation"
        operation: "password_hash"

      - call: "argon2.verify"
        algo_id: ALGO-ARGON2
        primitive: "key_derivation"
        operation: "password_verify"

      - call: "hkdf"
        algo_id: ALGO-HKDF
        primitive: "key_derivation"
        operation: "key_derivation"

  # =========================================================================
  # 4. BROWSER & RUNTIME WEBCRYPTO (crypto.subtle, SubtleCrypto)
  # =========================================================================
  - name: web_crypto
    imports:
      - "crypto.subtle"
      - "window.crypto.subtle"
      - "window.crypto"
      - "SubtleCrypto"
    call_patterns:
      - call: "subtle.generateKey"
        operation: "key_generation"
        curve_mappings:
          P-256: "NIST-P256"
          P-384: "NIST-P384"
          P-521: "NIST-P521"
        flag_insecure_if:
          key_size_less_than: 2048

      - call: "subtle.encrypt"
        operation: "encryption"

      - call: "subtle.decrypt"
        operation: "decryption"

      - call: "subtle.sign"
        operation: "digital_signature"

      - call: "subtle.verify"
        operation: "signature_verification"

      - call: "subtle.digest"
        operation: "digest_computation"
        flag_insecure_algorithms:
          - "SHA-1"

      - call: "subtle.deriveKey"
        operation: "key_derivation"

      - call: "subtle.deriveBits"
        operation: "key_derivation"

      - call: "getRandomValues"
        algo_id: ALGO-CSPRNG
        primitive: "prng"

  # =========================================================================
  # 5. CRYPTO-JS
  # =========================================================================
  - name: crypto_js
    imports:
      - "crypto-js"
    call_patterns:
      - call: "CryptoJS.AES.encrypt"
        algo_id: ALGO-AES
        primitive: "symmetric_cipher"
        operation: "encryption"
        flag_insecure_modes:
          - "mode.ECB"
          - "ECB"

      - call: "CryptoJS.AES.decrypt"
        algo_id: ALGO-AES
        primitive: "symmetric_cipher"
        operation: "decryption"

      - call: "CryptoJS.DES.encrypt"
        algo_id: ALGO-DES
        primitive: "symmetric_cipher"
        flag_insecure: true
        operation: "encryption"

      - call: "CryptoJS.TripleDES.encrypt"
        algo_id: ALGO-3DES
        primitive: "symmetric_cipher"
        flag_insecure: true
        operation: "encryption"

      - call: "CryptoJS.RC4.encrypt"
        algo_id: ALGO-RC4
        primitive: "symmetric_cipher"
        flag_insecure: true
        operation: "encryption"

      - call: "CryptoJS.Rabbit.encrypt"
        algo_id: ALGO-RABBIT
        primitive: "symmetric_cipher"
        operation: "encryption"

      - call: "CryptoJS.MD5"
        algo_id: ALGO-MD5
        primitive: "hash"
        flag_insecure: true

      - call: "CryptoJS.SHA1"
        algo_id: ALGO-SHA1
        primitive: "hash"
        flag_insecure: true

      - call: "CryptoJS.SHA256"
        algo_id: ALGO-SHA2-256
        primitive: "hash"

      - call: "CryptoJS.SHA512"
        algo_id: ALGO-SHA2-512
        primitive: "hash"

      - call: "CryptoJS.HmacMD5"
        algo_id: ALGO-HMAC
        primitive: "mac"
        flag_insecure: true

      - call: "CryptoJS.HmacSHA1"
        algo_id: ALGO-HMAC
        primitive: "mac"
        flag_insecure: true

      - call: "CryptoJS.HmacSHA256"
        algo_id: ALGO-HMAC
        primitive: "mac"

  # =========================================================================
  # 6. NODE-FORGE & MODERN ECC (@noble/curves, tweetnacl, elliptic)
  # =========================================================================
  - name: node_forge
    imports:
      - "node-forge"
      - "forge"
    call_patterns:
      - call: "forge.rsa.generateKeyPair"
        algo_id: ALGO-RSA
        primitive: "public_key"
        operation: "keypair_generation"
        flag_insecure_if:
          key_size_less_than: 2048

      - call: "forge.cipher.createCipher"
        operation: "symmetric_encryption_init"

      - call: "forge.md.md5.create"
        algo_id: ALGO-MD5
        primitive: "hash"
        flag_insecure: true

      - call: "forge.md.sha1.create"
        algo_id: ALGO-SHA1
        primitive: "hash"
        flag_insecure: true

      - call: "forge.md.sha256.create"
        algo_id: ALGO-SHA2-256
        primitive: "hash"

  - name: noble_and_nacl
    imports:
      - "@noble/curves"
      - "@noble/hashes"
      - "tweetnacl"
      - "libsodium-wrappers"
      - "elliptic"
    call_patterns:
      - call: "secp256k1.getPublicKey"
        algo_id: ALGO-ECDSA
        curve: "secp256k1"
        primitive: "signature"

      - call: "ed25519.getPublicKey"
        algo_id: ALGO-ED25519
        curve: "Ed25519"
        primitive: "signature"

      - call: "x25519.getSharedSecret"
        algo_id: ALGO-X25519
        curve: "X25519"
        primitive: "key_exchange"

      - call: "nacl.sign.keyPair"
        algo_id: ALGO-ED25519
        curve: "Ed25519"
        primitive: "signature"

      - call: "nacl.box.keyPair"
        algo_id: ALGO-X25519
        curve: "X25519"
        primitive: "key_exchange"

      - call: "nacl.secretbox"
        algo_id: ALGO-XSALSA20-POLY1305
        primitive: "symmetric_cipher"

      - call: "ec.genKeyPair"
        algo_id: ALGO-ECC
        primitive: "public_key"
        operation: "keypair_generation"