schema_version: "1.0"
description: "ELF/PE crypto evidence indicators."

libraries:
  "libcrypto": "OpenSSL/libcrypto"
  "libssl": "OpenSSL/libssl"
  "libsodium": "libsodium"
  "libgcrypt": "libgcrypt"
  "libmbedtls": "Mbed TLS"
  "libwolfssl": "wolfSSL"
  "libbotan": "Botan"
  "liboqs": "liboqs"
  "libgnutls": "GnuTLS"
  "libnss": "NSS"

symbol_patterns:
  - "EVP_"
  - "RSA_"
  - "EC_KEY_"
  - "ECDSA"
  - "ECDH"
  - "ED25519"
  - "X25519"
  - "SSL_"
  - "TLS_"
  - "X509_"
  - "HMAC_"
  - "PKCS"
  - "PEM_"
  - "OSSL_"
  - "crypto_"
  - "sodium_"
  - "OQS_"
  - "mbedtls_"
  - "wolfSSL"
  - "gnutls_"
  - "AES"
  - "CHACHA20"
  - "SHA[0-9_]*"
  - "MD5"
  - "DES"
  - "RC4"

string_patterns:
  - "-----BEGIN CERTIFICATE-----"
  - "-----BEGIN PUBLIC KEY-----"
  - "-----BEGIN PRIVATE KEY-----"
  - "-----BEGIN RSA PRIVATE KEY-----"
  - "TLSv1"
  - "SSLv"
  - "AES"
  - "RSA"
  - "ECDSA"
  - "ECDH"
  - "Ed25519"
  - "X25519"
  - "ChaCha20"
  - "SHA-"
  - "SHA[0-9]"
  - "MD5"
  - "HMAC"
  - "PKCS"
  - "libcrypto"
  - "libssl"
  - "libsodium"
  - "liboqs"

algorithm_patterns:
  - "AES-(?:128|192|256)-(?:GCM|CBC|CTR|ECB)"
  - "DES-EDE3-CBC"
  - "MD5"
  - "SHA256"
  - "SHA512"
  - "ML-KEM"
  - "Kyber(?:-[0-9]+)?"