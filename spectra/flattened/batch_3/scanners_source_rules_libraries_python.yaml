version: "2.0"
language: python
description: "Unified cryptographic ruleset capturing AST calls, ECC curves, and CodeQL/ECDAT API patterns."

libraries:
  # =========================================================================
  # 1. CRYPTOGRAPHY (hazmat & x509)
  # =========================================================================
  - name: cryptography
    imports:
      - cryptography.hazmat.primitives.ciphers
      - cryptography.hazmat.primitives.ciphers.algorithms
      - cryptography.hazmat.primitives.ciphers.modes
      - cryptography.hazmat.primitives.asymmetric.rsa
      - cryptography.hazmat.primitives.asymmetric.ec
      - cryptography.hazmat.primitives.asymmetric.dsa
      - cryptography.hazmat.primitives.asymmetric.ed25519
      - cryptography.hazmat.primitives.asymmetric.x25519
      - cryptography.hazmat.primitives.asymmetric.ed448
      - cryptography.hazmat.primitives.asymmetric.x448
      - cryptography.hazmat.primitives.asymmetric.padding
      - cryptography.hazmat.primitives.hashes
      - cryptography.hazmat.primitives.kdf
      - cryptography.hazmat.primitives.serialization
      - cryptography.x509
    call_patterns:
      # Symmetric Ciphers
      - call: "Cipher"
        default_algo_id: ALGO-AES
        extract_args:
          position_0: "algorithm"
          position_1: "mode"
        flag_insecure_modes:
          - "ECB"
          - "modes.ECB"

      # RSA Key Generation & CodeQL APIs
      - call: "rsa.generate_private_key"
        algo_id: ALGO-RSA
        extract_args:
          key_size: "key_size"
          public_exponent: "public_exponent"
        flag_insecure_if:
          key_size_less_than: 2048

      # Elliptic Curve (ECC) Key Generation
      - call: "ec.generate_private_key"
        algo_id: ALGO-ECC
        extract_args:
          position_0: "curve"
          curve: "curve"
        curve_mappings:
          SECP256R1: "NIST-P256"
          SECP384R1: "NIST-P384"
          SECP521R1: "NIST-P521"
          SECP256K1: "secp256k1"
          BrainpoolP256R1: "brainpoolP256r1"

      # Modern Curves
      - call: "ed25519.Ed25519PrivateKey.generate"
        algo_id: ALGO-ED25519
      - call: "x25519.X25519PrivateKey.generate"
        algo_id: ALGO-X25519
      - call: "ed448.Ed448PrivateKey.generate"
        algo_id: ALGO-ED448
      - call: "x448.X448PrivateKey.generate"
        algo_id: ALGO-X448

      # DSA Key Generation (Legacy/Insecure)
      - call: "dsa.generate_private_key"
        algo_id: ALGO-DSA
        extract_args:
          key_size: "key_size"
        flag_insecure: true

      # CodeQL ECDAT Ingested API Calls
      - call: "encrypt"
        operation: "encryption"
      - call: "decrypt"
        operation: "decryption"
      - call: "sign"
        operation: "digital_signature"
      - call: "verify"
        operation: "signature_verification"

      # Serialization & Deserialization
      - call: "serialization.load_pem_private_key"
        operation: "load_key"
        algo_id: ALGO-ASYMMETRIC-KEY
      - call: "serialization.load_pem_public_key"
        operation: "load_key"
        algo_id: ALGO-ASYMMETRIC-KEY
      - call: "serialization.load_der_private_key"
        operation: "load_key"
      - call: "serialization.load_der_public_key"
        operation: "load_key"
      - call: "x509.load_pem_x509_certificate"
        operation: "certificate_parse"
        algo_id: ALGO-X509
      - call: "x509.load_der_x509_certificate"
        operation: "certificate_parse"
        algo_id: ALGO-X509

  # =========================================================================
  # 2. PYCRYPTODOME / PYCRYPTO
  # =========================================================================
  - name: pycryptodome
    imports:
      - Crypto.Cipher
      - Cryptodome.Cipher
      - Crypto.PublicKey.RSA
      - Crypto.PublicKey.ECC
      - Crypto.PublicKey.DSA
      - Cryptodome.PublicKey.RSA
      - Cryptodome.PublicKey.ECC
      - Cryptodome.PublicKey.DSA
      - Crypto.Signature
      - Cryptodome.Signature
      - Crypto.Hash
      - Cryptodome.Hash
    call_patterns:
      # Symmetric Ciphers
      - call: "AES.new"
        algo_id: ALGO-AES
        extract_args:
          position_1: "mode"
          mode: "mode"
        flag_insecure_modes:
          - "MODE_ECB"
          - "AES.MODE_ECB"
      - call: "DES.new"
        algo_id: ALGO-DES
        flag_insecure: true
      - call: "DES3.new"
        algo_id: ALGO-3DES
        flag_insecure: true
      - call: "ARC4.new"
        algo_id: ALGO-RC4
        flag_insecure: true
      - call: "Blowfish.new"
        algo_id: ALGO-BLOWFISH
        flag_insecure: true
      - call: "ChaCha20.new"
        algo_id: ALGO-CHACHA20
      - call: "ChaCha20_Poly1305.new"
        algo_id: ALGO-CHACHA20-POLY1305

      # Asymmetric RSA
      - call: "RSA.generate"
        algo_id: ALGO-RSA
        extract_args:
          position_0: "bits"
          bits: "bits"
        flag_insecure_if:
          key_size_less_than: 2048
      - call: "RSA.import_key"
        operation: "load_key"

      # Asymmetric ECC
      - call: "ECC.generate"
        algo_id: ALGO-ECC
        extract_args:
          position_0: "curve"
          curve: "curve"
        curve_mappings:
          P-256: "NIST-P256"
          p256: "NIST-P256"
          secp256r1: "NIST-P256"
          P-384: "NIST-P384"
          P-521: "NIST-P521"
          secp256k1: "secp256k1"
          Ed25519: "Ed25519"
          ed25519: "Ed25519"
      - call: "ECC.import_key"
        operation: "load_key"

      # DSA
      - call: "DSA.generate"
        algo_id: ALGO-DSA
        flag_insecure: true

  # =========================================================================
  # 3. PURE PYTHON ECC LIBRARIES (ecdsa, coincurve, fastecdsa)
  # =========================================================================
  - name: python-ecdsa
    imports:
      - ecdsa
      - ecdsa.SigningKey
      - ecdsa.VerifyingKey
      - ecdsa.curves
    call_patterns:
      - call: "SigningKey.generate"
        algo_id: ALGO-ECDSA
        extract_args:
          curve: "curve"
        curve_mappings:
          NIST192p: "NIST-P192"
          NIST224p: "NIST-P224"
          NIST256p: "NIST-P256"
          NIST384p: "NIST-P384"
          NIST521p: "NIST-P521"
          SECP256k1: "secp256k1"
          BRAINPOOLP256r1: "brainpoolP256r1"
          Ed25519: "Ed25519"
        flag_insecure_curves:
          - "NIST192p"
      - call: "SigningKey.from_pem"
        operation: "load_pem_private_key"
      - call: "VerifyingKey.from_pem"
        operation: "load_pem_public_key"
      - call: "sign"
        operation: "digital_signature"
      - call: "verify"
        operation: "signature_verification"

  - name: coincurve
    imports:
      - coincurve
      - coincurve.PrivateKey
      - coincurve.PublicKey
    call_patterns:
      - call: "PrivateKey"
        algo_id: ALGO-ECDSA
        curve: "secp256k1"
      - call: "PublicKey"
        algo_id: ALGO-ECDSA
        curve: "secp256k1"
      - call: "sign"
        operation: "digital_signature"
      - call: "verify"
        operation: "signature_verification"

  - name: fastecdsa
    imports:
      - fastecdsa.keys
      - fastecdsa.ecdsa
      - fastecdsa.curve
    call_patterns:
      - call: "keys.gen_keypair"
        algo_id: ALGO-ECDSA
        extract_args:
          position_0: "curve"
          curve: "curve"
      - call: "ecdsa.sign"
        operation: "digital_signature"
      - call: "ecdsa.verify"
        operation: "signature_verification"

  # =========================================================================
  # 4. PYNACL (libsodium bindings)
  # =========================================================================
  - name: pynacl
    imports:
      - nacl.public
      - nacl.secret
      - nacl.signing
      - nacl.pwhash
    call_patterns:
      - call: "PrivateKey.generate"
        algo_id: ALGO-X25519
        primitive: "key_exchange"
      - call: "SigningKey.generate"
        algo_id: ALGO-ED25519
        primitive: "digital_signature"
      - call: "SecretBox"
        algo_id: ALGO-XSALSA20-POLY1305
      - call: "Box"
        algo_id: ALGO-X25519-XSALSA20-POLY1305
      - call: "sign"
        operation: "digital_signature"
      - call: "verify"
        operation: "signature_verification"

  # =========================================================================
  # 5. HASHLIB & HMAC
  # =========================================================================
  - name: hashlib
    imports:
      - hashlib
    call_patterns:
      - call: "md5"
        algo_id: ALGO-MD5
        flag_insecure: true
      - call: "sha1"
        algo_id: ALGO-SHA1
        flag_insecure: true
      - call: "sha224"
        algo_id: ALGO-SHA2-224
      - call: "sha256"
        algo_id: ALGO-SHA2-256
      - call: "sha384"
        algo_id: ALGO-SHA2-384
      - call: "sha512"
        algo_id: ALGO-SHA2-512
      - call: "sha3_256"
        algo_id: ALGO-SHA3-256
      - call: "sha3_512"
        algo_id: ALGO-SHA3-512
      - call: "blake2b"
        algo_id: ALGO-BLAKE2B
      - call: "blake2s"
        algo_id: ALGO-BLAKE2S
      - call: "new"
        extract_args:
          position_0: "name"
          name: "name"

  - name: hmac
    imports:
      - hmac
    call_patterns:
      - call: "hmac.new"
        algo_id: ALGO-HMAC
        extract_args:
          position_2: "digestmod"
          digestmod: "digestmod"
        flag_insecure_if_digest:
          - "md5"
          - "hashlib.md5"
          - "sha1"
          - "hashlib.sha1"

  # =========================================================================
  # 6. M2CRYPTO (OpenSSL wrapper)
  # =========================================================================
  - name: m2crypto
    imports:
      - M2Crypto.RSA
      - M2Crypto.EC
      - M2Crypto.EVP
      - M2Crypto.X509
    call_patterns:
      - call: "RSA.gen_key"
        algo_id: ALGO-RSA
        extract_args:
          position_0: "bits"
        flag_insecure_if:
          key_size_less_than: 2048
      - call: "EC.gen_key"
        algo_id: ALGO-ECC
        extract_args:
          position_0: "curve"
      - call: "Cipher"
        extract_args:
          position_0: "cipher_name"
      - call: "load_cert"
        operation: "load_pem_x509_certificate"
      - call: "load_key"
        operation: "load_pem_private_key"

  # =========================================================================
  # 7. PYTHON-RSA
  # =========================================================================
  - name: rsa
    imports:
      - rsa
    call_patterns:
      - call: "rsa.newkeys"
        algo_id: ALGO-RSA
        extract_args:
          position_0: "nbits"
          nbits: "nbits"
        flag_insecure_if:
          key_size_less_than: 2048
      - call: "rsa.encrypt"
        operation: "encryption"
      - call: "rsa.decrypt"
        operation: "decryption"
      - call: "rsa.sign"
        operation: "digital_signature"
      - call: "rsa.verify"
        operation: "signature_verification"

  # =========================================================================
  # 8. PYTHON STANDARD SSL & SECRETS
  # =========================================================================
  - name: ssl
    imports:
      - ssl
    call_patterns:
      - call: "SSLContext"
        extract_args:
          position_0: "protocol"
          protocol: "protocol"
        flag_insecure_protocols:
          - "PROTOCOL_SSLv2"
          - "PROTOCOL_SSLv3"
          - "PROTOCOL_TLSv1"
          - "PROTOCOL_TLSv1_1"
      - call: "load_cert_chain"
        operation: "load_pem_x509_certificate"
      - call: "set_ciphers"
        operation: "configure_cipher_suites"

  - name: secrets
    imports:
      - secrets
      - random
    call_patterns:
      - call: "token_bytes"
        algo_id: ALGO-CSPRNG
      - call: "token_hex"
        algo_id: ALGO-CSPRNG
      - call: "random.random"
        flag_insecure: true
        issue: "Non-cryptographic PRNG used in security context"
      - call: "random.randint"
        flag_insecure: true
        issue: "Non-cryptographic PRNG used in security context"