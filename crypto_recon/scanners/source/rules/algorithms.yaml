version: "1.0"
algorithms:
  # --- Symmetric Ciphers ---
  - id: ALGO-AES
    name: AES
    primitive: symmetric_cipher
    quantum_safe: false # AES-128 is Grover vulnerable; AES-256 is quantum-safe
    nist_status: approved
    patterns:
      - '(?i)\bAES[-_]?(128|192|256)?[-_]?(GCM|CBC|CTR|ECB|CFB|OFB)?\b'
    weak_modes:
      - ECB

  - id: ALGO-DES
    name: DES
    primitive: symmetric_cipher
    quantum_safe: false
    nist_status: deprecated_classical
    patterns:
      - '(?i)\b(DES|3DES|DESede)\b'
    weak_modes:
      - ALL

  - id: ALGO-CHACHA20
    name: ChaCha20
    primitive: symmetric_cipher
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bChaCha20(-Poly1305)?\b'
    weak_modes: []

  # --- Asymmetric / Public Key (Shor-Vulnerable) ---
  - id: ALGO-RSA
    name: RSA
    primitive: public_key
    quantum_safe: false
    nist_status: deprecated_pqc
    patterns:
      - '(?i)\bRSA[-_]?(1024|2048|3072|4096)?\b'
    weak_modes: []

  - id: ALGO-ECDSA
    name: ECDSA
    primitive: signature
    quantum_safe: false
    nist_status: deprecated_pqc
    patterns:
      - '(?i)\bECDSA\b'
      - '(?i)\b(secp256k1|secp256r1|secp384r1|secp521r1|prime256v1)\b'
    weak_modes: []

  - id: ALGO-ECDH
    name: ECDH
    primitive: key_exchange
    quantum_safe: false
    nist_status: deprecated_pqc
    patterns:
      - '(?i)\b(ECDH|ECDHE|X25519|X448)\b'
    weak_modes: []

  - id: ALGO-DSA
    name: DSA
    primitive: signature
    quantum_safe: false
    nist_status: deprecated_classical
    patterns:
      - '(?i)\bDSA[-_]?(1024|2048)?\b'
    weak_modes: []

  # --- Post-Quantum Cryptography (FIPS 203, 204, 205) ---
  - id: ALGO-ML-KEM
    name: ML-KEM
    primitive: key_encapsulation
    quantum_safe: true
    nist_status: fips_203_standard
    patterns:
      - '(?i)\b(ML[-_]?KEM|Kyber)[-_]?(512|768|1024)?\b'
    weak_modes: []

  - id: ALGO-ML-DSA
    name: ML-DSA
    primitive: signature
    quantum_safe: true
    nist_status: fips_204_standard
    patterns:
      - '(?i)\b(ML[-_]?DSA|Dilithium)[-_]?(44|65|87)?\b'
    weak_modes: []

  - id: ALGO-SLH-DSA
    name: SLH-DSA
    primitive: signature
    quantum_safe: true
    nist_status: fips_205_standard
    patterns:
      - '(?i)\b(SLH[-_]?DSA|SPHINCS\+?)\b'
    weak_modes: []

  # --- Hash Functions ---
  - id: ALGO-SHA2
    name: SHA-2
    primitive: hash
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bSHA[-_]?(224|256|384|512)\b'
    weak_modes: []

  - id: ALGO-SHA3
    name: SHA-3
    primitive: hash
    quantum_safe: true
    nist_status: approved
    patterns:
      - '(?i)\bSHA3[-_]?(224|256|384|512)\b'
    weak_modes: []

  - id: ALGO-MD5
    name: MD5
    primitive: hash
    quantum_safe: false
    nist_status: broken_classical
    patterns:
      - '(?i)\bMD5\b'
    weak_modes:
      - ALL

  - id: ALGO-SHA1
    name: SHA-1
    primitive: hash
    quantum_safe: false
    nist_status: broken_classical
    patterns:
      - '(?i)\bSHA[-_]?1\b'
    weak_modes:
      - ALL